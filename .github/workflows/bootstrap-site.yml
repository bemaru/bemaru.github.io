name: Bootstrap site

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

concurrency:
  group: bootstrap-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'feat/initial-blog'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/initial-blog
          fetch-depth: 0

      - name: Verify and restore site bundle
        run: |
          cat .bootstrap/part-* | base64 --decode > /tmp/site.tar.gz
          echo "f92deb0e39d287cc93ee9cf37cbc3364d08a0ef6b158332e46bca798f65c0991  /tmp/site.tar.gz" | sha256sum --check -
          tar -xzf /tmp/site.tar.gz -C .
          rm -rf .bootstrap

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Generate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate site
        env:
          INCLUDE_DRAFTS: "true"
        run: npm run validate

      - name: Commit clean site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "feat: bootstrap Astro developer blog"
          git push origin HEAD:feat/initial-blog
